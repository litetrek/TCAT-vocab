name: Weekly Database Backup

on:
  schedule:
    - cron: '0 0 * * 0'   # Sunday 00:00 UTC
  workflow_dispatch: {}    # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="tcat_backup_${TIMESTAMP}.dump"

          # pg_dump with custom format (compressed, restorable with pg_restore)
          # Note: uses DATABASE_URL — if this is the pgBouncer transaction pooler
          # (port 6543) and pg_dump fails, switch DATABASE_URL to the direct
          # connection string (port 5432) in GitHub Secrets.
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-acl \
            --no-owner \
            --file="$BACKUP_FILE"

          SIZE=$(stat -c%s "$BACKUP_FILE")
          echo "Backup file: $BACKUP_FILE  (${SIZE} bytes)"

          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Backup file suspiciously small (${SIZE} bytes) — possible failure"
            exit 1
          fi

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: Verify backup contents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # List tables in the dump to confirm it's not empty
          pg_restore --list "$BACKUP_FILE" | grep -E "TABLE DATA" | head -20
          echo "---"
          echo "Dump verified: table data sections found above."

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcat-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90

      - name: Print summary
        run: |
          echo "## Backup Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`$BACKUP_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(stat -c%s $BACKUP_FILE) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: 90 days" >> "$GITHUB_STEP_SUMMARY"
          echo "- Priority table: \`trans_revisions\` (future fine-tuning corpus)" >> "$GITHUB_STEP_SUMMARY"
