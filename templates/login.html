<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddhist Vocabulary — Sign In</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --ink: #1a1208;
      --paper: #f5f0e8;
      --red: #8b2020;
    }

    body {
      min-height: 100vh;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
      position: relative;
    }

    /* Subtle mandala background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(201,168,76,0.08) 0%, transparent 70%),
        repeating-conic-gradient(rgba(201,168,76,0.03) 0deg, transparent 1deg, transparent 14deg, rgba(201,168,76,0.03) 15deg);
      pointer-events: none;
    }

    .login-card {
      background: var(--paper);
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 4px;
      padding: 3rem 2.5rem;
      width: 380px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 60px rgba(201,168,76,0.15), 0 20px 60px rgba(0,0,0,0.5);
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Gold top bar */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .dharma-wheel {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 10px;
      margin-bottom: 0.5rem;
      display: block;
    }

    .title-zh {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.1rem;
      color: var(--red);
      letter-spacing: 0.15em;
      margin-bottom: 0.25rem;
    }

    .title-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b5a3a;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.5rem auto;
    }

    .sign-in-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: var(--ink);
      color: var(--gold-light);
      border: 1px solid rgba(201,168,76,0.5);
      border-radius: 3px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .sign-in-btn:hover {
      background: #2a1f0a;
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(201,168,76,0.2);
      color: var(--gold);
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #9a8060;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img class="dharma-wheel" src="{{ url_for('static', filename='Tcat-logo.png') }}" alt="T-CAT logo">
    <div class="title-zh">佛學詞彙翻譯平台</div>
    <div class="title-en">Buddhist Vocabulary</div>
    <div class="subtitle">Translation Review System</div>
    <div class="divider"></div>
    <a href="/auth/google" class="sign-in-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </a>
    <p class="footer-note">Access restricted to authorized team members</p>
  </div>
</body>
</html>
